  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var DUR = 6;

      // ---------------------------------------------------------------
      // Scene 1 (0.0–1.4s) — card-morph-anchor: call-card -> mini-calendar
      // ---------------------------------------------------------------
      var MORPH_START = 0;
      var MORPH_DUR = 0.9;
      var START_SCALE = 1.1; // incoming call-card was slightly larger (~55% frame height)
      var END_SCALE = 1.0; // settles into this frame's own ~50%-height card
      var OLD_FADE_FRAC = 0.4;
      var NEW_FADE_FRAC = 0.4;

      tl.fromTo(
        "#cal03-morph-card",
        { scale: START_SCALE, borderRadius: "29px" },
        { scale: END_SCALE, borderRadius: "24px", duration: MORPH_DUR, ease: "power2.inOut" },
        MORPH_START,
      );

      tl.fromTo(
        "#cal03-content-old",
        { opacity: 1 },
        { opacity: 0, duration: MORPH_DUR * OLD_FADE_FRAC, ease: "power1.in" },
        MORPH_START,
      );

      tl.fromTo(
        "#cal03-content-new",
        { opacity: 0 },
        { opacity: 1, duration: MORPH_DUR * NEW_FADE_FRAC, ease: "power1.out" },
        MORPH_START + MORPH_DUR * (1 - NEW_FADE_FRAC),
      );

      // ---------------------------------------------------------------
      // Scene 2 (1.4–3.2s) — asr-keyword-glow mechanics adapted to the
      // VEN/16 slot: single linear driver, attack→sustain→decay-to-rest
      // envelope, never looped. The envelope drives glow + scale (a panel,
      // not a glyph, so background/box-shadow stand in for text-shadow).
      // ---------------------------------------------------------------
      var ATTACK_DUR = 0.2;
      var RELEASE = 0.4;
      var REST_LEVEL = 0.3; // breadcrumb — the pick stays visible as "live"
      var MAX_GLOW = 22; // px
      var MAX_SCALE_BOOST = 0.07;
      var REST_RGB = { r: 243, g: 243, b: 247 }; // card-bg
      var PEAK_RGB = { r: 40, g: 96, b: 225 }; // primary cobalt
      var SLOT_TIMING = { start: 1.5, end: 1.9 };

      function envelope(t, start, end) {
        if (t < start) return 0;
        if (t < end) return Math.min((t - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (t < releaseEnd) return 1 - ((t - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }
      function lerpCh(a, b, f) {
        return Math.round(a + (b - a) * f);
      }

      var slotEl = document.getElementById("cal03-slot-ven16");
      var confirmRowEl = document.getElementById("cal03-confirm-row");

      // Held-breather jitter (deliberate hold beat, Scene 3's last ~1.5s):
      // computed from the same deterministic driver — no CSS transition,
      // no GSAP repeat/yoyo — subtle sine offset only, gated to the hold.
      var JITTER_START = 4.3;
      var JITTER_AMP = 1.6; // px
      var JITTER_HZ = 1.6;

      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            if (slotEl) {
              var env = envelope(driver.t, SLOT_TIMING.start, SLOT_TIMING.end);
              var bg =
                "rgb(" +
                lerpCh(REST_RGB.r, PEAK_RGB.r, env) +
                ", " +
                lerpCh(REST_RGB.g, PEAK_RGB.g, env) +
                ", " +
                lerpCh(REST_RGB.b, PEAK_RGB.b, env) +
                ")";
              slotEl.style.backgroundColor = bg;
              slotEl.style.boxShadow = "0 0 " + (MAX_GLOW * env).toFixed(1) + "px rgba(40, 96, 225, " + (0.15 + 0.55 * env).toFixed(2) + ")";
              slotEl.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env).toFixed(3) + ")";
            }
            if (confirmRowEl) {
              var jy = driver.t > JITTER_START ? Math.sin((driver.t - JITTER_START) * JITTER_HZ) * JITTER_AMP : 0;
              confirmRowEl.style.transform = "translateY(" + jy.toFixed(2) + "px)";
            }
          },
        },
        0,
      );

      // ---------------------------------------------------------------
      // Scene 3 (3.2–6.0s) — confirmation line, per-word spring-pop stagger,
      // then the checkmark spring-pops beside it; held read for the last
      // ~1.5s (subtle jitter above is the only motion during the hold).
      // ---------------------------------------------------------------
      var WORDS_ENTRY_AT = 3.2;
      var STAGGER = 0.08;
      var POP_DUR = 0.45;

      gsap.utils.toArray(".cal03-word").forEach(function (el, i) {
        tl.fromTo(
          el,
          { scale: 0, opacity: 0, y: 14 },
          { scale: 1, opacity: 1, y: 0, duration: POP_DUR, ease: "power3.out" },
          WORDS_ENTRY_AT + i * STAGGER,
        );
      });

      tl.fromTo(
        "#cal03-check",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.75,
      );

      window.__timelines["03-calendar"] = tl;
      tl.seek(0);
    })();
  </script>
