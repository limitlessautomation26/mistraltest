    (function () {
      var rootEl = document.querySelector('[data-composition-id="04-routing"]');
      if (!rootEl) { return; }

      function build() {
        var gsap = window.gsap;
        if (!gsap) { return; }

        // Measure + arm the three branch lines for a deterministic stroke draw.
        var lineIds = ["r04-line-left", "r04-line-mid", "r04-line-right"];
        lineIds.forEach(function (id) {
          var p = rootEl.querySelector("#" + id);
          var len = p.getTotalLength();
          p.style.strokeDasharray = len;
          p.style.strokeDashoffset = len;
        });

        // Legend words start fully hidden (set explicitly so seeking to t=0 is correct).
        gsap.set(rootEl.querySelectorAll(".r04-word"), { opacity: 0, y: 14 });
        gsap.set(rootEl.querySelector("#r04-accent-line"), { scaleX: 0, opacity: 0 });

        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-1.2s): the "Demande client" node springs in, top-center.
        tl.fromTo(
          rootEl.querySelector("#r04-source"),
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          0.1
        );

        // Scene 2 (1.2-4.2s): three branch lines self-draw left -> right; each
        // destination node spring-pops in as its own line completes. Staggered
        // cascade: line1 -> node1, line2 -> node2, line3 -> node3, never together.
        tl.to(
          rootEl.querySelector("#r04-line-left"),
          { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
          1.2
        );
        tl.fromTo(
          rootEl.querySelector("#r04-node-agenda"),
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          1.75
        );

        tl.to(
          rootEl.querySelector("#r04-line-mid"),
          { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
          1.9
        );
        tl.fromTo(
          rootEl.querySelector("#r04-node-equipe"),
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          2.45
        );

        tl.to(
          rootEl.querySelector("#r04-line-right"),
          { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
          2.6
        );
        tl.fromTo(
          rootEl.querySelector("#r04-node-crm"),
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          3.15
        );

        // Scene 3 (4.2-6.0s): legend resolves beneath the diagram, per-word stagger,
        // held read to the frame's exit.
        tl.to(
          rootEl.querySelector("#r04-accent-line"),
          { scaleX: 1, opacity: 1, duration: 0.4, ease: "power2.out" },
          4.2
        );

        var words = rootEl.querySelectorAll(".r04-word");
        for (var i = 0; i < words.length; i++) {
          tl.fromTo(
            words[i],
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
            4.3 + i * 0.08
          );
        }

        window.__timelines = window.__timelines || {};
        window.__timelines["04-routing"] = tl;
        tl.seek(0);
      }

      // window.__timelines["04-routing"] to register too late (observed as
      // a sub_timeline_readiness_timeout at render time: the composition
      // rendered frozen on its end state instead of animating).
      build();
    })();
