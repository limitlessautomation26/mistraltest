  <script src="../../assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });

      // --- Scene 1 (0.0-1.3s): beat 1 spring-pop entrance -----------------------
      // spring-pop-entrance: smooth power3.out settle, no overshoot. Hero must
      // read by t <= 0.5s, so it lands fully by 0.47s.
      var ENTRY_AT = 0.05;
      var POP_DUR = 0.42;

      // --- Scene 2 / Scene 3: velocity-matched swipe-up handoffs ----------------
      // scale-swap-transition mechanics (shrink-out + spring pop-in morph),
      // shaped as a vertical swipe: outgoing accelerates up and off (power2.in),
      // incoming arrives from below on the same velocity curve and settles
      // (power3.out). Both handoffs reuse the exact same values so the two cuts
      // read as one repeated, matched move.
      var EXIT_DUR = 0.4; // outgoing shrink + swipe-up-and-out
      var ENTER_DUR = 0.55; // incoming swipe-up-into-place + settle (> EXIT_DUR)
      var OVERLAP = 0.15; // incoming starts this long before outgoing finishes
      var EXIT_SCALE = 0.72;
      var SWIPE_Y = 90; // shared travel distance: exit to -SWIPE_Y, enter from +SWIPE_Y

      var TRIGGER1 = 1.3; // Scene 2 (1.3-1.5s): beat 1 -> beat 2
      var TRIGGER2 = 2.6; // Scene 3 (2.6-2.8s): beat 2 -> beat 3

      var H1_ENTER_AT = TRIGGER1 + EXIT_DUR - OVERLAP;
      var H2_ENTER_AT = TRIGGER2 + EXIT_DUR - OVERLAP;

      // Base z-order + collapsed/offset starting states, applied immediately
      // (outside the timeline) so they hold at the seek-0 frame — a zero-duration
      // tl.set(...) at position 0 does not render while the playhead sits exactly
      // at 0, so this must not go through the paused timeline.
      gsap.set("#triptych-05-beat-1", { zIndex: 3 });
      gsap.set(
        "#triptych-05-beat-2",
        { zIndex: 2, opacity: 0, scale: EXIT_SCALE, y: SWIPE_Y },
      );
      gsap.set(
        "#triptych-05-beat-3",
        { zIndex: 1, opacity: 0, scale: EXIT_SCALE, y: SWIPE_Y },
      );

      // Scene 1 — beat 1 arrives.
      tl.fromTo(
        "#triptych-05-beat-1",
        { scale: 0, opacity: 0, y: 0 },
        { scale: 1, opacity: 1, y: 0, duration: POP_DUR, ease: "power3.out" },
        ENTRY_AT,
      );

      // Scene 2 — handoff 1: beat 1 swipes up and out; beat 2 swipes up into place.
      tl.to(
        "#triptych-05-beat-1",
        { y: -SWIPE_Y, scale: EXIT_SCALE, opacity: 0, duration: EXIT_DUR, ease: "power2.in" },
        TRIGGER1,
      );
      tl.set("#triptych-05-beat-2", { zIndex: 4 }, H1_ENTER_AT);
      tl.to(
        "#triptych-05-beat-2",
        {
          y: 0,
          scale: 1,
          opacity: 1,
          duration: ENTER_DUR,
          ease: "power3.out",
        },
        H1_ENTER_AT,
      );

      // Scene 3 — handoff 2: identical matched-velocity swipe, beat 2 -> beat 3.
      tl.to(
        "#triptych-05-beat-2",
        { y: -SWIPE_Y, scale: EXIT_SCALE, opacity: 0, duration: EXIT_DUR, ease: "power2.in" },
        TRIGGER2,
      );
      tl.set("#triptych-05-beat-3", { zIndex: 5 }, H2_ENTER_AT);
      tl.to(
        "#triptych-05-beat-3",
        {
          y: 0,
          scale: 1,
          opacity: 1,
          duration: ENTER_DUR,
          ease: "power3.out",
        },
        H2_ENTER_AT,
      );

      // Scene N — beat 3 lands and holds to the frame's exit (root transition
      // owns the cut-out; no exit tween authored here).

      window.__timelines["05-triptych"] = tl;
      tl.seek(0);
    })();
  </script>
